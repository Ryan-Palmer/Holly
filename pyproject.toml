[project]
name = "holly"
version = "0.1.0"
description = "A local voice-in, voice-out Holly, the ship's computer"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "snac>=1.2",
    "faster-whisper>=1.1",
    "silero-vad>=5.1",
    "voxcpm>=2.0",
    "kaldifst==1.9.0",  # 1.9.1 has no Windows wheel
    "triton-windows<3.8; sys_platform == 'win32'",
    # Install torch from PyTorch's CUDA 12.8+ index first; see README.
    "torch>=2.7",
    "ddgs>=9.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
