[project]
name = "holly"
version = "0.1.0"
description = "A local voice-in, voice-out Holly, the ship's computer"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
