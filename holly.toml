# Holly configuration. Paths are relative to this file.

[llm]
# Use 127.0.0.1, not localhost: on Windows "localhost" tries IPv6 first and
# adds about 2 seconds to every request.
base_url = "http://127.0.0.1:1234"
# Gemma 4 26B-A4B, a mixture-of-experts model with 4B parameters active per
# token: writes ~3x faster than Gemma 4 31B (first token ~105 ms against
# ~260 ms) in ~4 GB less VRAM, which also lets the voice stream (see
# wait_for_reply). It's a little chattier than 31B, which is slightly drier;
# both passed 39/40 persona prompts. 31B: "google/gemma-4-31b-qat".
model = "google/gemma-4-26b-a4b-qat"
# Load with a set context, not LM Studio's default of 100k+ tokens, whose KV
# cache fills VRAM. 30208 (LM Studio rounds 30000 up to it) holds the persona
# and tools (~1K tokens), up to ~23K of history (see [persona]), a turn's
# searches and the reply; ~29.5 GB of the 5090 in use with the face up, 2.4 GB
# free. Its vision projector (mmproj-*.gguf, beside the model in LM Studio's
# models folder) is kept, though Holly shows it no images yet: 1.1 GB, plus
# ~0.5 GB of buffers. Moved out of the folder, Gemma loads text-only (README).
# 26B-A4B rereads a long prompt fast: 16K tokens of history cost ~0.1 s more
# before the first word than a cached one.
context_length = 30208
# One slot: Holly sends one request at a time, so more slots only cost VRAM.
# 2048-token batches reread a long history fastest (1.9 s for 23K tokens
# against 2.3 at 512), for ~0.35 GB more VRAM, measured with the projector
# loaded. Text-only, LM Studio keeps its inner batch at 512 whatever this says.
parallel = 1
eval_batch_size = 2048
# Thinking adds 0.5 to 6 seconds before the first word. Holly doesn't think.
reasoning_effort = "none"
temperature = 0.8
# A poem or short story takes 100-250 tokens.
max_tokens = 300

[tts.voxcpm]
# VoxCPM2 clones the voice from a reference clip and its transcript, made by
# voice/prep.py export. Runs in this process, on the GPU, at 48 kHz.
model = "openbmb/VoxCPM2"
reference_wav = "voice/data/holly/reference.wav"
reference_text = "voice/data/holly/reference.txt"
# torch.compile (needs triton-windows). The first start after an install
# compiles for a few minutes; later starts reuse the cache.
compile = true
# Wait for the LLM to finish the reply before speaking, instead of speaking
# each sentence as it's written. The two share the GPU, and with Gemma 31B
# VoxCPM slowed from ~26 to ~3 steps a second, so waiting was faster (2.7 s
# against 3.7 s, and no stutters). With 26B-A4B the overlap is short enough
# that streaming wins: 1.74 s median from end of speech, no stutters.
wait_for_reply = false
# Refinement steps per chunk of audio (VoxCPM's own default is 10). Fewer is
# proportionally faster, and may cost some quality.
inference_timesteps = 10

[audio]
# WASAPI adds a few ms of output latency; MME, sounddevice's default on
# Windows, adds about 100 ms.
host_api = "Windows WASAPI"
# Output device name (or part of it) within that host API; empty for its default.
output_device = ""
# Playback block length.
block_ms = 20

[face]
# Holly's animated face (phase 2, face/README.md): a window showing
# Ditto's Holly, which also plays his voice so the two stay in step.
# --face / --no-face on the command line override this.
enabled = false
python = "face/.venv/Scripts/python.exe"
image = "face/data/holly_colour.jpg"
port = 50555
# Audio queued ahead of the speakers, giving Ditto time to draw each frame.
# Holly starts speaking this much later than without a face.
lead_ms = 600
# The height Ditto's frames are drawn at; 0 for the still's own (1820x1024),
# so full screen isn't a stretched 720p. The window opens 720 high; resize
# or maximise it, or press F11 or double-click for full screen (Escape
# leaves), and the face is scaled to fit with black around it.
height = 0
# How much of Ditto's head movement (pitch, yaw, roll and position) is kept
# while Holly is silent: 0 holds his head still, 1 lets it sway as Ditto
# drives it. While he speaks it moves fully.
idle_head = 0.2
# The face sleeps awake_s (under [listen]) after Holly last spoke: he nods off
# into the still, eyes closed, and Ditto pauses, sparing the GPU (~40% of the 5090 and ~200 W
# awake, ~0% and ~50 W asleep). It wakes as soon as anyone starts speaking.

[listen]
# Microphone, within audio.host_api: a name (or part of one), or empty for
# that host API's default input.
input_device = ""
# Which of the device's channels to mix into mono, counting from 1; empty
# mixes them all. Set this to the mic's channel if the others are noisy.
input_channels = []
# Silero VAD: speech starts above start_threshold and is over after
# end_silence_ms below end_threshold. 400 ms is the plan's starting point;
# raise it if Holly cuts in while you pause mid-sentence.
start_threshold = 0.5
end_threshold = 0.35
end_silence_ms = 400
# Turns shorter than this are coughs, clicks and keyboard noise.
min_speech_ms = 250
# Audio kept from before speech starts, so the first syllable isn't clipped.
preroll_ms = 300
# large-v3-turbo: 1.5 GB of VRAM, ~59 ms a sentence. base.en (0.56 GB, ~29 ms)
# got all ten synthetic test sentences and seemed fine at first, but over a
# longer try by voice it wasn't good enough; small.en and distil-large-v3
# misheard the crew's names even in the tests.
whisper_model = "large-v3-turbo"
whisper_device = "cuda"
# int8 weights: same transcripts and speed as float16 in half the VRAM.
whisper_compute_type = "int8_float16"
# Whisper is told to expect these names. Without them it cut "Holly" short, and
# wrote "Critton" for Kryten, "Ruma" for Rimmer and "Kalkinski" for Kochanski, so
# recall found nothing. With them, tested: all right, and "Christian", "listen"
# and "the cat next door" still come out as said.
whisper_hotwords = "Holly, Kryten, Lister, Rimmer, Kochanski, Cat, Red Dwarf, Starbug"
# Holly answers only when one of these is among the first or last
# wake_edge_words words you say ("Holly, what's...", "...tomorrow, Holly?"),
# or while he's awake. Empty, or --no-wake, and he answers everything.
wake_words = ["holly", "hollie", "holley"]
wake_edge_words = 3
# He stays awake this long after he last spoke: no wake word needed, and
# his face keeps moving. Then his face sleeps, and you need "Holly" again.
awake_s = 30.0

[persona]
system_prompt = "persona/system_prompt.md"
examples = "persona/examples.toml"
# Rolling history, in tokens (counted as ~4 characters each). Past
# history_soft_tokens, once he's asleep (awake_s after he last spoke), the
# older exchanges are folded into his notes (app/memory.py), at most
# memory_tokens, and the newest history_keep_tokens are kept word for word.
# LM Studio then rereads the shorter prompt while he's still asleep.
# The count runs ~10% high (16.8K counted was 15.1K real), so these are safe.
# Folding 16K into notes took 1.5 s, and the reread after it 0.6 s.
history_soft_tokens = 20000
history_keep_tokens = 8000
# His notes: what lasts about the crew, and what happened lately, with dates.
# 1,500 tokens (~1,100 words) is ~5% of the context. Notes that long would
# take ~10 s to write, while he sleeps; three days' worth took 1-3 s.
memory_tokens = 1500
# History and notes are saved here after every reply, so he remembers you
# from one session to the next; at startup the last session goes into his
# notes, all but its newest history_resume_tokens, while the voice loads.
# Empty to keep nothing. --forget sets the file aside and starts afresh.
memory_file = "data/memory.json"
history_resume_tokens = 1500
# If he talks on without sleeping, past history_hard_tokens the oldest
# exchanges are dropped at once, without notes, in one go down to two thirds
# of it. One at a time would change the start of the prompt every turn, and
# LM Studio would reread the whole history each time (2.6 s per turn, live).
# Only size counts, not the number of exchanges.
history_hard_tokens = 26000

[search]
# Holly looks things up on the web (app/search.py): his chat model asks for a
# search, and the same model boils the results down to two or three
# sentences, which are all that go back into his conversation.
# --search / --no-search on the command line override this.
enabled = true
# "ddgs": free metasearch (DuckDuckGo and others), no key, unofficial; the
# engines may answer with a CAPTCHA instead of results.
# "brave": the Brave Search API, with the key in the BRAVE_API_KEY
# environment variable (~1,000 searches a month free, then metered).
# "brave_context": Brave's LLM Context API, same key: passages from each
# result's page rather than a snippet. Over 16 varied questions it answered
# 16 (web search 15), in the same ~1.6 s, never needed a second search, and
# said a cricket score was out of date where web search passed an August
# match off as live.
# A list is tried in order: with no key, an error or no results, the next.
# Not brave after brave_context: one service and key, so they fail together.
provider = "brave_context,ddgs"
# Page text brave_context returns per search, in all.
context_tokens = 2048
# The ddgs engines to try. "auto" tries them all but waits on the ones that
# refuse: 2.1 s, against 0.8-1.1 s for this list. From here DuckDuckGo,
# Mojeek and Startpage often answer with CAPTCHAs (always, with a VPN on).
backend = "yahoo,brave,duckduckgo"
region = "uk-en"
max_results = 6
timeout_s = 5.0
# Lookups (searches and forecasts) allowed per reply; the clock doesn't count.
# A cap, so he can't keep searching; each lookup already retries within
# itself (max_rounds), and the weather can need two (an unknown place, then
# the nearest town).
max_searches = 3
summary_max_tokens = 160
# Each search is judged by the same Gemma, out of Holly's sight: it answers
# from the results, reads a promising result's page (prices and times are
# often only there), or tries a better search, up to max_rounds searches and
# reads, starting none after max_lookup_s. Holly sees only the outcome.
max_rounds = 3
max_lookup_s = 5.0
# Gemma's thinking for that judgement: "none", or "low" and up. "low" took
# 3-11 s a judgement against ~0.3 s, and answered no better.
summary_reasoning = "none"
# Rules for when to search, added to his system prompt.
prompt = "persona/search_prompt.md"
# A weather tool too (app/weather.py): forecasts from Open-Meteo, which is
# free and needs no key. Web search can't do the weather: its results are
# links to weather sites, not forecasts. Places in home_country come first.
weather = true
home_country = "GB"
# Said while a search runs, when his reply starts with one. Rendered in his
# voice at startup so they play at once. Write your own.
fillers = [
    "Hang on. I'll look it up.",
    "Bear with me. I'm having a look.",
    "One moment. I'm checking.",
    "Give us a second. I'll find out.",
]

[recall]
# Holly's archive (app/archive.py): every exchange that leaves his history,
# folded into notes or dropped, is kept in SQLite with when it was said. His
# recall tool searches it by keyword (stemmed: "cookies" finds "cookie") and by
# day ("yesterday", "on Tuesday", "21 November"), and the same Gemma answers
# from what it finds in two or three sentences, out of his sight.
enabled = true
file = "data/archive.db"
# The ship's records: Holly's memory of Red Dwarf itself, from the Red Dwarf
# fandom wiki (app/records.py: `python -m app.records fetch`, then `build`).
# Recall searches them too, and while he sleeps a few close to what's been
# said (and one at random) go into his prompt, to bring up now and then.
records_file = "data/records.db"
reminders = 5
# Matches by meaning, from this embedding model in LM Studio (~0.3 GB), loaded
# at startup; "" for keywords and days only. Its similarities bunch between
# 0.4 and 0.65, related or not, so the closest few above a loose floor go to
# the judge, which drops the misses.
embed_model = "text-embedding-nomic-embed-text-v1.5"
meaning_entries = 8
min_similarity = 0.5
# Keyword matches the judge reads, best first (plus all of a day asked about).
max_entries = 12
summary_max_tokens = 200
# Rules for when to recall, added to his system prompt.
prompt = "persona/recall_prompt.md"
# Said while he recalls, when his reply starts with it.
fillers = [
    "Hang on. It's in here somewhere.",
    "Let me think. It rings a bell.",
    "One moment. I'm having a rummage.",
]

[timers]
# Timers and reminders (app/timers.py): "set a timer for 20 minutes", "remind
# me at half seven to ring Mum". The code works out when, from a duration or a
# time and day; they're kept in this file between sessions. When one is due,
# Holly speaks up at the next pause; one that came due while he was off is
# mentioned when he's next up.
enabled = true
file = "data/timers.json"
prompt = "persona/timers_prompt.md"


[spotify]
# The crew's music on Spotify (app/spotify.py): "play some Talking Heads",
# "skip this", "turn it down", "what's this song?". Needs Spotify Premium, a
# Spotify app's client ID in the user environment variable SPOTIFY_CLIENT_ID,
# and signing in once: .venv\Scripts\python -m app.spotify login. Spotify does
# the playing, on whichever device is open; with none, the desktop app is opened.
enabled = true
token_file = "data/spotify_token.json"
device = ""  # part of a device's name, to play there when nothing is playing
volume_step = 15
market = "GB"  # the country whose catalogue to search
prompt = "persona/spotify_prompt.md"
# Said while Spotify's desktop app is opened, when nothing has it open (~5-10 s).
fillers = [
    "Hang on. I'm just waking Spotify up.",
    "One moment. The music's still getting its shoes on.",
]
