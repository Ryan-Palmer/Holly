# Holly configuration. Paths are relative to this file.

[llm]
# Use 127.0.0.1, not localhost: on Windows "localhost" tries IPv6 first and
# adds about 2 seconds to every request.
base_url = "http://127.0.0.1:1234"
# Gemma plays a more convincingly senile Holly; Qwen is twice as fast to the
# first token (about 150 ms against 330 ms) but more literal.
model = "google/gemma-4-31b-qat"
# Load with a small context. LM Studio's default for these models is 100k+
# tokens, whose KV cache spills out of VRAM and slows everything down.
# 4096 holds the persona (~600 tokens) and 24 turns of history (~1,300), and
# saves 1.1 GB over 8192, which the full voice loop needs.
context_length = 4096
# Thinking adds 0.5 to 6 seconds before the first word. Holly doesn't think.
reasoning_effort = "none"
temperature = 0.8
max_tokens = 200

[tts]
# Stock voice until the cloned one is ready. Orpheus runs in LM Studio and
# emits SNAC audio codes, which are decoded to 24 kHz audio on the GPU.
model = "orpheus-3b-0.1-ft"
context_length = 4096
# Preset voices: tara, leah, jess, mia, zoe (female); leo, dan, zac (male).
voice = "leo"
temperature = 0.6
top_p = 0.9
repeat_penalty = 1.1
snac_model = "hubertsiuzdak/snac_24khz"
device = "cuda"

[audio]
# WASAPI adds a few ms of output latency; MME, sounddevice's default on
# Windows, adds about 100 ms.
host_api = "Windows WASAPI"
# Output device name (or part of it) within that host API; empty for its default.
output_device = ""
# Samples per playback block at 24 kHz; 480 is 20 ms.
blocksize = 480

[listen]
# Microphone, within audio.host_api: a name (or part of one), or empty for
# that host API's default input.
input_device = ""
# Which of the device's channels to mix into mono, counting from 1; empty
# mixes them all. Set this to the mic's channel if the others are noisy.
input_channels = []
# Silero VAD: speech starts above start_threshold and is over after
# end_silence_ms below end_threshold. 400 ms is the plan's starting point;
# raise it if Holly cuts in while you pause mid-sentence.
start_threshold = 0.5
end_threshold = 0.35
end_silence_ms = 400
# Turns shorter than this are coughs, clicks and keyboard noise.
min_speech_ms = 250
# Audio kept from before speech starts, so the first syllable isn't clipped.
preroll_ms = 300
whisper_model = "large-v3-turbo"
whisper_device = "cuda"
# int8 weights: same transcripts and speed as float16 in half the VRAM
# (2.2 GB against 4.3, counting CTranslate2's memory cache).
whisper_compute_type = "int8_float16"

[persona]
system_prompt = "persona/system_prompt.md"
examples = "persona/examples.toml"
# Rolling history, in user+Holly exchanges.
history_turns = 24
